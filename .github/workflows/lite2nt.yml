name: Lite2 NoTranslate Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lite2nt.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Kototoro-app/Kototoro
          ref: v2.5.3
          submodules: recursive
      - name: Patch
        run: |
          echo '' > /tmp/p.b64
          echo '' >> /tmp/p.b64
          base64 -d /tmp/p.b64 | gunzip > /tmp/patch.py && python3 /tmp/patch.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew :app:assembleBenchmark --no-daemon --stacktrace > /tmp/build.log 2>&1
      - name: Publish
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/benchmark/*arm64-v8a*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$APK" | head -3 > /tmp/notes.txt
          ls -l "$APK" >> /tmp/notes.txt
          gh release create -R ${{ github.repository }} lite2nt-r${{ github.run_number }} "$APK" --title "lite2nt run ${{ github.run_number }}" --notes-file /tmp/notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish log
        if: always()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Caused by|Execution failed|BUILD " /tmp/build.log | head -150 | cut -c1-400 > /tmp/err.txt || true
          [ -s /tmp/err.txt ] || echo "no errors found" > /tmp/err.txt
          tail -60 /tmp/build.log | cut -c1-300 >> /tmp/err.txt
          gzip -k /tmp/build.log
          gh release create -R ${{ github.repository }} lognt-r${{ github.run_number }} /tmp/build.log.gz --prerelease --title "log ${{ github.run_number }}" --notes-file /tmp/err.txt
        env:
          GH_TOKEN: ${{ github.token }}
