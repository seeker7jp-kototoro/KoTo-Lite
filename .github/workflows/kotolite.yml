name: KoTo Lite Release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kotolite.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Kototoro-app/Kototoro
          ref: v2.5.5
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: devel
          path: lite
          sparse-checkout: .github/workflows
      - name: Patch (same patch as lite2nt)
        run: |
          grep -oP "echo '\K[A-Za-z0-9+/=]+(?=')" lite/.github/workflows/lite2nt.yml | tr -d '\n' | base64 -d | gunzip > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Patch notification small icon
        run: |
          echo '' | base64 -d > /tmp/stat_icon.py
          python3 /tmp/stat_icon.py
      - name: Replace remaining Totoro images with the bear
        run: |
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          cat > /tmp/totoro.py <<'PY'
          from PIL import Image
          R = 'app/src/main/res/'
          src = Image.open(R + 'mipmap-xxxhdpi/ic_launcher.webp').convert('RGBA')
          o = src.copy()
          px = src.load()
          po = o.load()
          for y in range(src.size[1]):
              for x in range(src.size[0]):
                  r, g, b, a = px[x, y]
                  f = min(1.0, max(0.0, r / 217.0))
                  po[x, y] = (int(f * 242), int(89 + f * 153), int(201 + f * 41), a)
          for d, s in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
              o.resize((s, s), Image.LANCZOS).save(R + 'drawable-' + d + '/ic_shortcut_default.png')
          print('shortcut icons replaced')
          PY
          python3 /tmp/totoro.py
          cp app/src/main/res/drawable/koto_ic_mono.xml app/src/main/res/drawable/ic_launcher_monochrome.xml
      - name: Keep the Discover feed manga-only
        run: |
          cat > /tmp/disc.py <<'PY'
          p = 'app/src/main/kotlin/org/skepsun/kototoro/explore/ui/DiscoveryFeedViewModel.kt'
          s = open(p, encoding='utf-8').read()
          a = "infos.map { it.mangaSource }.distinctBy { it.name }"
          b = ".map { it.mangaSource }\n                .distinctBy { it.name },"
          assert a in s and b in s
          flt = ".filter { it.mangaSource.getContentType() !in KOTO_HIDDEN_TYPES }"
          s = s.replace(a, "infos" + flt + ".map { it.mangaSource }.distinctBy { it.name }")
          s = s.replace("contentSourcesRepository.observeEnabledSources().value\n                .map { it.mangaSource }",
                        "contentSourcesRepository.observeEnabledSources().value\n                " + flt + "\n                .map { it.mangaSource }")
          assert s.count('KOTO_HIDDEN_TYPES') == 2
          s = s.rstrip('\n') + "\n\nprivate val KOTO_HIDDEN_TYPES = setOf(\n    org.skepsun.kototoro.parsers.model.ContentType.NOVEL,\n    org.skepsun.kototoro.parsers.model.ContentType.HENTAI_NOVEL,\n    org.skepsun.kototoro.parsers.model.ContentType.VIDEO,\n    org.skepsun.kototoro.parsers.model.ContentType.HENTAI_VIDEO,\n)\n"
          s = s.replace("\nimport org.skepsun.kototoro.explore.data.ContentSourcesRepository", "\nimport org.skepsun.kototoro.core.model.getContentType\nimport org.skepsun.kototoro.explore.data.ContentSourcesRepository", 1)
          assert 'import org.skepsun.kototoro.core.model.getContentType' in s
          open(p, 'w', encoding='utf-8').write(s)
          print('discover feed picker: video/novel sources hidden')
          PY
          python3 /tmp/disc.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew :app:assembleBenchmark --no-daemon --stacktrace > /tmp/build.log 2>&1
      - name: Publish
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/benchmark/*arm64-v8a*.apk | head -1)
          VER=$(grep -oP "versionName = '\K[^']+" app/build.gradle | head -1)
          cp "$APK" "/tmp/kotolite-$VER.apk"
          printf '%s\n' "kotolite $VER (based on Kototoro $VER, no-translation build)" "" "What changed in this build:" "- Updated to upstream Kototoro $VER with all KoTo Lite changes carried over (manga-only UI, no image upscaling, torrent or translation, arm64 only)." "- Bear icons kept (launcher, download notification, shortcuts)." "- New Discover feed: the source picker for adding rows hides video and novel sources, so the feed stays manga-only." "- Same signing key as before, so it installs over the existing KoTo Lite." > /tmp/notes.txt
          gh release create -R ${{ github.repository }} "kotolite-$VER-r${{ github.run_number }}" "/tmp/kotolite-$VER.apk" --title "kotolite $VER" --notes-file /tmp/notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish log
        if: always()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Caused by|Execution failed|BUILD " /tmp/build.log | head -150 | cut -c1-400 > /tmp/err.txt || true
          [ -s /tmp/err.txt ] || echo "no errors found" > /tmp/err.txt
          tail -60 /tmp/build.log | cut -c1-300 >> /tmp/err.txt
          gzip -k /tmp/build.log
          gh release create -R ${{ github.repository }} "logkl-r${{ github.run_number }}" /tmp/build.log.gz --prerelease --title "build log ${{ github.run_number }}" --notes-file /tmp/err.txt
        env:
          GH_TOKEN: ${{ github.token }}
